<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DealTrace — Automotive Valuation Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <!-- Supabase JS SDK & Auth Layer -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    function applySavedLang() {
      const saved = localStorage.getItem('dealtrace_lang');
      if (saved === 'ar' || (!saved && (navigator.language || '').toLowerCase().startsWith('ar'))) {
        document.documentElement.lang = 'ar';
        document.documentElement.dir = 'rtl';
        const txt = document.getElementById('initText');
        if (txt) txt.textContent = 'جاري تهيئة مساحة العمل…';
      }
    }

    async function checkAuthAndRedirect() {
      applySavedLang();
      try {
        if (window.SupabaseAuth) {
          const session = await window.SupabaseAuth.getAdminSession();
          if (session && session.user) {
            window.location.replace('add-car.html');
            return;
          }
        }
      } catch (err) {
        console.warn('Auth redirect check failed:', err);
      }
      window.location.replace('login.html');
    }
    document.addEventListener('DOMContentLoaded', checkAuthAndRedirect);
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=login.html">
  </noscript>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0B0F17;
      background-image: radial-gradient(circle at 50% 30%, rgba(245, 158, 11, 0.08) 0%, transparent 60%);
      color: #94A3B8;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    [dir="rtl"] {
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
    }
    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: fadeIn 0.4s ease-out;
    }
    .logo-img {
      height: 52px;
      width: auto;
    }
    .loader-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }
    .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(245, 158, 11, 0.2);
      border-top-color: #F59E0B;
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }
    .status-text {
      font-size: 13.5px;
      font-weight: 500;
      color: #64748B;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="splash-card">
    <img src="assets/logo-dark.svg" alt="DealTrace" class="logo-img">
    <div class="loader-wrap">
      <div class="spinner"></div>
      <span class="status-text" id="initText">Initializing workspace…</span>
    </div>
  </div>
</body>
</html>
