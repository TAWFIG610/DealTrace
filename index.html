<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DealTrace</title>
  <!-- Supabase JS SDK & Auth Layer -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    async function checkAuthAndRedirect() {
      try {
        if (window.SupabaseAuth) {
          const session = await window.SupabaseAuth.getAdminSession();
          if (session && session.user) {
            window.location.replace('add-car.html');
            return;
          }
        }
      } catch (err) {
        console.warn('Auth redirect check failed:', err);
      }
      window.location.replace('login.html');
    }
    document.addEventListener('DOMContentLoaded', checkAuthAndRedirect);
  </script>
  <!-- Immediate fallback if JavaScript is delayed -->
  <noscript>
    <meta http-equiv="refresh" content="0; url=login.html">
  </noscript>
  <style>
    body {
      background: #F5F2EA;
      color: #5B564C;
      font-family: 'Public Sans', system-ui, -apple-system, sans-serif;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(166, 116, 44, 0.2);
      border-top-color: #A6742C;
      border-radius: 50%;
      animation: spin 0.8s ease-in-out infinite;
      margin-bottom: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p {
      font-size: 14px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Loading DealTrace…</p>
</body>
</html>
