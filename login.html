<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — DealTrace Automotive Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- Supabase JS SDK (Official CDN) & i18n -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="i18n.js"></script>
<style>
  :root {
    --bg-base: #0B0F17;
    --card-bg: rgba(15, 23, 42, 0.88);
    --card-border: rgba(255, 255, 255, 0.08);
    --text-primary: #F8FAFC;
    --text-secondary: #94A3B8;
    --text-muted: #64748B;
    --input-bg: rgba(15, 23, 42, 0.6);
    --input-border: #334155;
    --accent: #F59E0B;
    --accent-hover: #D97706;
    --accent-glow: rgba(245, 158, 11, 0.25);
    --danger: #EF4444;
    --danger-bg: rgba(239, 68, 68, 0.12);
    --good: #10B981;
    --good-bg: rgba(16, 185, 129, 0.12);
    --radius-lg: 16px;
    --radius-md: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg-base);
    background-image: 
      radial-gradient(circle at 50% 15%, rgba(245, 158, 11, 0.09) 0%, transparent 50%),
      radial-gradient(circle at 85% 80%, rgba(30, 41, 59, 0.4) 0%, transparent 40%),
      radial-gradient(circle at 15% 85%, rgba(15, 23, 42, 0.6) 0%, transparent 50%);
    color: var(--text-primary);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
    position: relative;
  }

  /* RTL Typography & Direction overrides */
  [dir="rtl"] {
    font-family: 'Cairo', system-ui, -apple-system, sans-serif;
    letter-spacing: 0 !important;
  }

  [dir="rtl"] .portal-pill {
    letter-spacing: 0;
  }

  /* Top Bar with Language Selector */
  .top-lang-bar {
    position: absolute;
    top: 20px;
    right: 24px;
    z-index: 50;
  }

  [dir="rtl"] .top-lang-bar {
    right: auto;
    left: 24px;
  }

  .lang-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: rgba(30, 41, 59, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 3px 6px;
    backdrop-filter: blur(8px);
  }

  .lang-icon {
    width: 14px;
    height: 14px;
    color: var(--text-muted);
    margin: 0 4px;
  }

  .lang-option {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 14px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
  }

  .lang-option:hover {
    color: var(--text-primary);
  }

  .lang-option.active {
    background: var(--accent);
    color: #0F172A;
    font-weight: 700;
  }

  .lang-sep {
    width: 1px;
    height: 12px;
    background: rgba(255, 255, 255, 0.15);
  }

  .login-container {
    width: 100%;
    max-width: 440px;
    position: relative;
    z-index: 10;
  }

  .ambient-glow {
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    width: 280px;
    height: 120px;
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(217, 119, 6, 0.05));
    filter: blur(48px);
    border-radius: 50%;
    pointer-events: none;
    z-index: -1;
  }

  .login-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-lg);
    padding: 40px 36px;
    backdrop-filter: blur(20px);
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
  }

  .logo-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 32px;
  }

  .logo-img {
    height: 48px;
    width: auto;
    margin-bottom: 14px;
    transition: transform 0.2s ease;
  }

  .logo-img:hover {
    transform: scale(1.02);
  }

  .portal-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(245, 158, 11, 0.12);
    border: 1px solid rgba(245, 158, 11, 0.25);
    color: #FBBF24;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 20px;
    font-family: 'JetBrains Mono', monospace;
  }

  .portal-pill-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #F59E0B;
    box-shadow: 0 0 8px #F59E0B;
  }

  .form-group {
    margin-bottom: 22px;
  }

  .form-group label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 8px;
    font-family: inherit;
  }

  .input-shell {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-icon {
    position: absolute;
    left: 14px;
    width: 18px;
    height: 18px;
    color: var(--text-muted);
    pointer-events: none;
    transition: color 0.18s ease;
  }

  [dir="rtl"] .input-icon {
    left: auto;
    right: 14px;
  }

  .input-shell input {
    width: 100%;
    font-family: inherit;
    font-size: 14.5px;
    padding: 13px 14px 13px 44px;
    border: 1.5px solid var(--input-border);
    border-radius: var(--radius-md);
    background: var(--input-bg);
    color: var(--text-primary);
    transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  }

  [dir="rtl"] .input-shell input {
    padding: 13px 44px 13px 14px;
  }

  .input-shell.has-toggle input {
    padding-right: 46px;
  }

  [dir="rtl"] .input-shell.has-toggle input {
    padding-right: 44px;
    padding-left: 46px;
  }

  .input-shell input::placeholder {
    color: #475569;
  }

  .input-shell input:focus {
    outline: none;
    border-color: var(--accent);
    background: rgba(30, 41, 59, 0.7);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .input-shell input:focus + .input-icon,
  .input-shell:focus-within .input-icon {
    color: var(--accent);
  }

  .toggle-pwd {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 6px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s;
  }

  [dir="rtl"] .toggle-pwd {
    right: auto;
    left: 12px;
  }

  .toggle-pwd:hover {
    color: var(--text-primary);
  }

  /* Status and Alerts */
  .status-banner {
    padding: 12px 14px;
    border-radius: var(--radius-md);
    font-size: 13.5px;
    line-height: 1.45;
    margin-bottom: 22px;
    display: none;
    animation: fadeIn 0.2s ease-out;
  }

  .status-banner.show { display: flex; align-items: flex-start; gap: 10px; }
  .status-banner.err {
    background: var(--danger-bg);
    color: #FCA5A5;
    border: 1px solid rgba(239, 68, 68, 0.25);
  }
  .status-banner.ok {
    background: var(--good-bg);
    color: #6EE7B7;
    border: 1px solid rgba(16, 185, 129, 0.25);
  }
  .status-banner.info {
    background: rgba(30, 41, 59, 0.7);
    color: #93C5FD;
    border: 1px solid rgba(59, 130, 246, 0.25);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Submit CTA Button */
  .btn-submit {
    width: 100%;
    margin-top: 10px;
    padding: 14px 20px;
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    border: none;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
    color: #0F172A;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 4px 14px rgba(217, 119, 6, 0.3);
    transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .btn-submit:hover {
    background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(217, 119, 6, 0.4);
  }

  .btn-submit:disabled {
    background: #334155;
    color: #64748B;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  .spinner {
    display: none;
    width: 18px;
    height: 18px;
    border: 2px solid rgba(15, 23, 42, 0.25);
    border-top-color: #0F172A;
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
  }

  .btn-submit.loading .spinner { display: inline-block; }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Security Footer */
  .security-footer {
    margin-top: 26px;
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .security-footer svg {
    width: 14px;
    height: 14px;
    color: var(--accent);
  }
</style>
</head>
<body>

<!-- Language Switcher in Top Corner -->
<div class="top-lang-bar">
  <div class="lang-pill" role="group" aria-label="Language Selector">
    <svg class="lang-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="2" y1="12" x2="22" y2="12"></line>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
    </svg>
    <button type="button" class="lang-option active" data-lang="en" onclick="window.I18n.setLanguage('en')">EN</button>
    <span class="lang-sep"></span>
    <button type="button" class="lang-option" data-lang="ar" onclick="window.I18n.setLanguage('ar')">العربية</button>
  </div>
</div>

<div class="login-container">
  <div class="ambient-glow"></div>
  <div class="login-card">
    
    <!-- Logo Header -->
    <div class="logo-header">
      <img src="assets/logo-dark.svg" alt="DealTrace" class="logo-img">
      <div class="portal-pill">
        <span class="portal-pill-dot"></span>
        <span data-i18n="login.badge">Dealership Admin Portal</span>
      </div>
    </div>

    <!-- Live Status Alert -->
    <div id="statusBanner" class="status-banner">
      <div id="statusMsg"></div>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      
      <div class="form-group">
        <label for="email" data-i18n="login.label_email">Admin Email</label>
        <div class="input-shell">
          <input type="email" id="email" required placeholder="admin@dealership.com" data-i18n-ph="login.ph_email" autocomplete="email" autofocus>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2"></rect>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
          </svg>
        </div>
      </div>

      <div class="form-group">
        <label for="password" data-i18n="login.label_password">Password</label>
        <div class="input-shell has-toggle">
          <input type="password" id="password" required placeholder="••••••••••••" data-i18n-ph="login.ph_password" autocomplete="current-password">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="loginBtn" class="btn-submit">
        <span class="spinner"></span>
        <span id="btnText" data-i18n="login.btn_submit">Sign In to DealTrace</span>
      </button>

    </form>

    <!-- Security Footnote -->
    <div class="security-footer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
      <span data-i18n="login.security_note">Secured by Supabase Cloud 256-bit Encryption</span>
    </div>

  </div>
</div>

<script>
  function showStatus(msg, type = 'info') {
    const banner = document.getElementById('statusBanner');
    const msgEl = document.getElementById('statusMsg');
    msgEl.textContent = msg;
    banner.className = 'status-banner show ' + type;
  }

  function hideStatus() {
    const banner = document.getElementById('statusBanner');
    banner.className = 'status-banner';
  }

  function togglePasswordVisibility() {
    const pwd = document.getElementById('password');
    const eye = document.getElementById('eyeIcon');
    if (pwd.type === 'password') {
      pwd.type = 'text';
      eye.innerHTML = `<path d="m9.88 9.88 4.24 4.24m-4.24 0 4.24-4.24M1 1l22 22M9.88 4.24A10.87 10.87 0 0 1 12 4c7 0 10 8 10 8a18.5 18.5 0 0 1-3.23 4.67M6.53 6.53C3.9 8.28 2 12 2 12s3 7 10 7c1.68 0 3.23-.42 4.61-1.15"></path>`;
    } else {
      pwd.type = 'password';
      eye.innerHTML = `<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle>`;
    }
  }

  async function checkExistingSession() {
    try {
      const session = await window.SupabaseAuth.getAdminSession();
      if (session && session.user) {
        showStatus(window.I18n.t('login.success'), 'ok');
        setTimeout(() => {
          window.location.replace('add-car.html');
        }, 600);
      }
    } catch (err) {
      console.warn('Session check note:', err);
    }
  }

  async function handleLogin(e) {
    e.preventDefault();
    hideStatus();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const btnText = document.getElementById('btnText');

    btn.disabled = true;
    btn.classList.add('loading');
    btnText.textContent = window.I18n.t('login.btn_verifying');

    try {
      await window.SupabaseAuth.signInAdmin(email, password);
      showStatus(window.I18n.t('login.success'), 'ok');
      setTimeout(() => {
        window.location.replace('add-car.html');
      }, 600);
    } catch (err) {
      console.error('Sign in error:', err);
      let message = err.message || '';
      if (message.includes('Invalid login credentials')) {
        message = window.I18n.t('login.err_credentials');
      } else {
        message = window.I18n.t('login.err_generic');
      }
      showStatus(message, 'err');
    } finally {
      btn.disabled = false;
      btn.classList.remove('loading');
      btnText.textContent = window.I18n.t('login.btn_submit');
    }
  }

  document.addEventListener('DOMContentLoaded', checkExistingSession);
</script>

</body>
</html>
