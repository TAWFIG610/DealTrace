<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Vehicle Deals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<!-- Supabase JS SDK (Official CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<style>
  :root {
    --paper: #F5F2EA;
    --panel: #FFFFFF;
    --ink: #211C15;
    --ink-soft: #5B564C;
    --ink-faint: #928C7E;
    --line: #DDD6C4;
    --line-strong: #C7BEA6;
    --brass: #A6742C;
    --brass-deep: #7C5620;
    --brass-tint: #F3E7CF;
    --steel: #435364;
    --steel-tint: #E7ECEF;
    --danger: #A3392F;
    --danger-tint: #F7E4E1;
    --good: #3E5C33;
    --good-tint: #EAF1E4;
    --radius: 12px;
  }

  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Public Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-wrapper {
    width: 100%;
    max-width: 440px;
  }

  .brand-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--brass-tint);
    color: var(--brass-deep);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 14px;
    border: 1px solid rgba(166, 116, 44, 0.2);
  }

  .brand-badge::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--brass);
  }

  .login-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 36px 32px;
    box-shadow: 0 4px 20px -2px rgba(33, 28, 21, 0.05);
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 28px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .subtitle {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 28px;
    line-height: 1.4;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 7px;
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  .input-wrap input {
    width: 100%;
    font-family: 'Public Sans', sans-serif;
    font-size: 14.5px;
    padding: 12px 14px;
    border: 1.5px solid var(--line-strong);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
    transition: border-color 0.15s, background-color 0.15s;
  }

  .input-wrap input:focus {
    outline: none;
    border-color: var(--brass);
    background: var(--panel);
  }

  .input-wrap.has-toggle input {
    padding-right: 44px;
  }

  .toggle-pwd {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    padding: 4px;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .toggle-pwd:hover {
    color: var(--ink);
  }

  .status-box {
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13.5px;
    margin-bottom: 20px;
    display: none;
    line-height: 1.4;
  }

  .status-box.show { display: block; }
  .status-box.err {
    background: var(--danger-tint);
    color: var(--danger);
    border: 1px solid rgba(163, 57, 47, 0.2);
  }
  .status-box.ok {
    background: var(--good-tint);
    color: var(--good);
    border: 1px solid rgba(62, 92, 51, 0.2);
  }
  .status-box.info {
    background: var(--steel-tint);
    color: var(--steel);
    border: 1px solid rgba(67, 83, 100, 0.2);
  }

  .btn-login {
    width: 100%;
    font-family: 'Public Sans', sans-serif;
    font-weight: 600;
    font-size: 15px;
    padding: 13px 20px;
    border: none;
    border-radius: 8px;
    background: var(--ink);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.15s;
  }

  .btn-login:hover {
    background: #3a352a;
  }

  .btn-login:disabled {
    background: var(--ink-faint);
    cursor: not-allowed;
  }

  .spinner {
    display: none;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 0.8s ease-in-out infinite;
  }

  .btn-login.loading .spinner { display: inline-block; }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .setup-accordion {
    margin-top: 24px;
    border-top: 1px dashed var(--line-strong);
    padding-top: 16px;
  }

  .setup-toggle {
    font-size: 12.5px;
    color: var(--ink-faint);
    background: none;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 0;
    font-weight: 500;
  }

  .setup-toggle:hover {
    color: var(--ink-soft);
  }

  .setup-content {
    display: none;
    margin-top: 14px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    font-size: 13px;
  }

  .setup-content.open { display: block; }

  .setup-content label {
    display: block;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }

  .setup-content input {
    width: 100%;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 8px 10px;
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: #fff;
    margin-bottom: 10px;
  }

  .btn-save-cfg {
    background: var(--brass);
    color: #fff;
    border: none;
    padding: 7px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-save-cfg:hover {
    background: var(--brass-deep);
  }

  .admin-note {
    margin-top: 18px;
    font-size: 12px;
    color: var(--ink-faint);
    text-align: center;
    line-height: 1.4;
  }

  .admin-note b {
    color: var(--ink-soft);
  }
</style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <div class="brand-badge">Dealership Portal</div>
    <h1>Vehicle Deals</h1>
    <p class="subtitle">Sign in to access your dealership's deal tracking and valuation history.</p>

    <div id="statusBox" class="status-box"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Admin Email</label>
        <div class="input-wrap">
          <input type="email" id="email" required placeholder="admin@dealership.com" autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap has-toggle">
          <input type="password" id="password" required placeholder="••••••••••••" autocomplete="current-password">
          <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="loginBtn" class="btn-login">
        <span class="spinner"></span>
        <span id="btnText">Sign In as Admin</span>
      </button>
    </form>

    <p class="admin-note">
      🔒 <b>Admin-Only Access:</b> Only verified dealership administrators are granted access to vehicle deal records.
    </p>

    <!-- Supabase Credentials Configuration Section -->
    <div class="setup-accordion">
      <button type="button" class="setup-toggle" onclick="toggleSetup()">
        <span>⚙️</span> Supabase Connection Settings
      </button>
      <div id="setupDrawer" class="setup-content">
        <p style="margin:0 0 10px;font-size:12px;color:var(--ink-soft);">
          Configure your Supabase project keys below. These are stored locally in your browser.
        </p>
        <label>Supabase Project URL</label>
        <input type="text" id="cfgUrl" placeholder="https://your-project.supabase.co">

        <label>Supabase Anon Public Key</label>
        <input type="password" id="cfgAnonKey" placeholder="eyJhbGciOiJIUzI1NiIsIn...">

        <label>Designated Admin Email</label>
        <input type="email" id="cfgAdminEmail" placeholder="admin@dealership.com">

        <button type="button" class="btn-save-cfg" onclick="saveConfigFromUI()">Save Settings</button>
      </div>
    </div>
  </div>
</div>

<script>
  function showStatus(msg, type = 'info') {
    const box = document.getElementById('statusBox');
    box.textContent = msg;
    box.className = 'status-box show ' + type;
  }

  function hideStatus() {
    const box = document.getElementById('statusBox');
    box.className = 'status-box';
    box.textContent = '';
  }

  function togglePasswordVisibility() {
    const pwd = document.getElementById('password');
    const eye = document.getElementById('eyeIcon');
    if (pwd.type === 'password') {
      pwd.type = 'text';
      eye.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
    } else {
      pwd.type = 'password';
      eye.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
    }
  }

  function toggleSetup() {
    const drawer = document.getElementById('setupDrawer');
    drawer.classList.toggle('open');
  }

  function loadSavedConfigInputs() {
    const cfg = window.SupabaseAuth.config;
    if (cfg.url && cfg.url !== 'YOUR_SUPABASE_PROJECT_URL') {
      document.getElementById('cfgUrl').value = cfg.url;
    }
    if (cfg.anonKey && cfg.anonKey !== 'YOUR_SUPABASE_ANON_KEY') {
      document.getElementById('cfgAnonKey').value = cfg.anonKey;
    }
    if (cfg.adminEmails && cfg.adminEmails.length) {
      document.getElementById('cfgAdminEmail').value = cfg.adminEmails[0];
    }
  }

  function saveConfigFromUI() {
    const url = document.getElementById('cfgUrl').value.trim();
    const key = document.getElementById('cfgAnonKey').value.trim();
    const adminEmail = document.getElementById('cfgAdminEmail').value.trim();

    if (!url || !key) {
      alert('Please provide both the Supabase URL and Anon Key.');
      return;
    }

    window.SupabaseAuth.saveSupabaseConfig(url, key, adminEmail);
    showStatus('Supabase settings updated successfully.', 'ok');
    document.getElementById('setupDrawer').classList.remove('open');
  }

  async function checkExistingSession() {
    if (!window.SupabaseAuth.isSupabaseConfigured()) {
      showStatus('Supabase connection keys not set yet. Please open "Supabase Connection Settings" below or enter them in supabase-client.js.', 'info');
      document.getElementById('setupDrawer').classList.add('open');
      return;
    }

    try {
      const session = await window.SupabaseAuth.getAdminSession();
      if (session && session.user) {
        showStatus('Authenticated as admin (' + session.user.email + '). Redirecting to dashboard…', 'ok');
        setTimeout(() => {
          window.location.href = 'add-car.html';
        }, 800);
      }
    } catch (err) {
      console.warn('Session check failed:', err);
    }
  }

  async function handleLogin(e) {
    e.preventDefault();
    hideStatus();

    if (!window.SupabaseAuth.isSupabaseConfigured()) {
      showStatus('Please configure your Supabase URL and Anon Key first in the settings below.', 'err');
      document.getElementById('setupDrawer').classList.add('open');
      return;
    }

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const btnText = document.getElementById('btnText');

    btn.disabled = true;
    btn.classList.add('loading');
    btnText.textContent = 'Verifying Admin Access…';

    try {
      const authResult = await window.SupabaseAuth.signInAdmin(email, password);
      showStatus('Login successful. Redirecting to workspace…', 'ok');
      setTimeout(() => {
        window.location.href = 'add-car.html';
      }, 700);
    } catch (err) {
      console.error('Sign in error:', err);
      let message = err.message || 'Login failed. Please check your credentials.';
      if (message.includes('Invalid login credentials')) {
        message = 'Invalid email or password. Please verify your credentials in Supabase Auth.';
      }
      showStatus(message, 'err');
    } finally {
      btn.disabled = false;
      btn.classList.remove('loading');
      btnText.textContent = 'Sign In as Admin';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadSavedConfigInputs();
    checkExistingSession();
  });
</script>

</body>
</html>
