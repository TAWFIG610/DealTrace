<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" width="280" height="64">
  <defs>
    <linearGradient id="dtAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="dtSlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="dtGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Icon (Telemetry Apex Chevron) -->
  <g transform="translate(4, 8)">
    <!-- Base geometric shield / gauge contour -->
    <rect x="0" y="0" width="48" height="48" rx="12" fill="url(#dtSlateGrad)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Forward speed telemetry path -->
    <path d="M12 34L22 18L30 26L38 14" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
    
    <!-- Precision Chevron Apex -->
    <path d="M16 28L25 15L34 28" stroke="url(#dtAmberGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#dtGlow)"/>
    <circle cx="25" cy="15" r="3" fill="#F59E0B" />
    
    <!-- Aerodynamic base trace -->
    <path d="M13 36H35" stroke="url(#dtAmberGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(64, 40)">
    <!-- DEAL -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="800" font-size="24" fill="#0F172A" letter-spacing="-0.03em">DEAL</text>
    <!-- TRACE -->
    <text x="68" y="0" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="600" font-size="24" fill="url(#dtAmberGrad)" letter-spacing="0.04em">TRACE</text>
    <!-- Subtitle tag -->
    <text x="2" y="14" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="8.5" fill="#64748B" letter-spacing="0.14em">AUTOMOTIVE VALUATION INTELLIGENCE</text>
  </g>
</svg>
